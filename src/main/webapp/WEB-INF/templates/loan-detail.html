<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Review & Underwriting Kredit</title>
        <link th:href= "@{/css/bootstrap.min.css}" rel="stylesheet">
        <link th:href= "@{/style/css}" rel="stylesheet">
    </head>
        <body>
            <div class="containet py-4">
                <h2 class="mb-4">Review Pengajuan Kredit</h2>

                <div class="card-mb4">
                    <div class = "card-header">Data Pengajuan</div>
                    <div class = "card-body">
                        <table class = "table table-bordered mb-0">
                            <tbody>
                                <tr>
                                    <th>Nama Calon Debitur</th>
                                    <td th:text="${loan.borrowerName}">Nama</td>
                                </tr>
                                <tr>
                                    <th>Nominal Pengajuan</th>
                                    <td th:text="'Rp ' + ${#numbers.formatInteger(loan.amount, 3, 'POINT')}">Rp 0</td>
                                </tr>
                                <tr>
                                    <th>Status Kredit</th>
                                    <td><span class="badge bg-secondary" th:text="${loan.status}">STATUS</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div th:if= "${decisionError != null}" class="alert alert-danger" role="alert">
                    <span th:text="${decisionError}">Error</span>
                </div>

                <div th:if= "${!isAuthorized}" class="alert alert-danger" role="alert">
                    Anda tidak berwenang memproses pengajuan ini (di luar limit approval).
                </div>

            </div>

        </body>
</html>
