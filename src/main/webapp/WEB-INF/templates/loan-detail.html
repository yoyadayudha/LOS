<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Detail Otorisasi Kredit</title>
        <link th:href="@{/style.css}" rel="stylesheet">
    </head>

    <body>
        
        <h2>Detail Pengajuan Kredit (Loan Origination System)</h2>

        <table border="1" cellpadding="10" cellspacing="0">
            <tr>
                <td><strong>Nama Calon Debitur</strong></td>
                <td th:text="${loan.borrowerName}">Nama</td>
            </tr>
            <tr>
                <td><strong>Nominal Pengajuan</strong></td>
                <td th:text="'Rp ' + ${#numbers.formatInteger(loan.amount, 3, 'POINT')}">Rp 0</td>
            </tr>
            <tr>
                <td><strong>Status Kredit</strong></td>
                <td th:text="${loan.status}">PENDING</td>
            </tr>

            <hr>

            <h3>Information Regarding (Approver)</h3>

            <div th:if="${!isAuthorized}" style="color:red; background-color: #ffcccc; padding: 15px; border: 1px solid red; border-radius: 5px;">
                You are not authorized to approve this!
            </div>

            <div th:if="${isAuthorized}">
                    <div style="color: green; background-color: #d4edda; padding: 15px; border: 1px solid green; border-radius: 5px; margin-bottom: 15px;"> 
                    You are authorized to approve this!
            </div>   

            <h3>Form Keputusan Akhir</h3>
            <form th:action="@{/loans/keputusan}" method="POST">

                <input type="hidden" name="loanId" th:value="${loan.id}">

                <div>
                    <label for="">Catatan Alasan Analisis:</label>
                    <br>
                    <textarea name="notes" id="" rows="4" cols="50" placeholder="Ketik hasil analisis anda disini..." required></textarea>
                </div>
                <br>
                <button type="submit" name = "action" value="APPROVED" style="background-color: green; color: white; padding: 5px 15px;">APPROVE</button>
                <button type="submit" name = "action" value="REJECTED" style="background-color: red; color: white; padding: 5px 15px;">REJECT</button>
            </form>
        </div>

        <br>
        <br>
        <a th:href="@{/loans}"><- Kembali</a>

        </table> 
    </body>
</html>
